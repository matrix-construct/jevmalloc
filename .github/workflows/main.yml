name: CI

on:
  pull_request:
    branches:
      - 'main'
  push:
    branches:
      - 'main'

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-unknown-linux-gnu (stable)
            target: x86_64-unknown-linux-gnu
            rust: stable
            tag: ubuntu-latest
            run_tests: 1
            jemalloc_tests: 1
          - name: x86_64-unknown-linux-gnu (nightly)
            target: x86_64-unknown-linux-gnu
            rust: nightly
            tag: ubuntu-latest
            run_tests: 1
            jemalloc_tests: 1
          - name: aarch64-unknown-linux-gnu (stable)
            target: aarch64-unknown-linux-gnu
            rust: stable
            tag: ubuntu-24.04-arm
            run_tests: 1
            jemalloc_tests: 0
          - name: x86_64-unknown-linux-musl
            target: x86_64-unknown-linux-musl
            rust: stable
            tag: ubuntu-latest
            run_tests: 0
            jemalloc_tests: 0
          - name: aarch64-apple-darwin (stable)
            target: aarch64-apple-darwin
            rust: stable
            tag: macos-latest
            run_tests: 0
            jemalloc_tests: 0
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: install
        run: |
          rustup default ${{ matrix.rust }}
          rustup target add "$TARGET"
          if [ "$TARGET" = "x86_64-unknown-linux-musl" ]; then
            sudo apt-get update && sudo apt-get install -y musl-tools
          fi
      - name: build
        run: cargo build --workspace --target "$TARGET" --all-features
      # The unprefixed regime is the default; the prefixed one is a distinct
      # link, so both are exercised.
      - name: test (unprefixed)
        if: matrix.run_tests == 1
        run: cargo test --workspace --target "$TARGET" --features stats
      - name: test (prefixed)
        if: matrix.run_tests == 1
        run: cargo test --workspace --target "$TARGET" --no-default-features --features stats
      - name: test (all features)
        if: matrix.run_tests == 1
        run: cargo test --workspace --target "$TARGET" --all-features
      # jemalloc's own suite: the real signal after a source bump, on the
      # targets the README's jemalloc column marks passing. The build script
      # does not watch the env var, so a distinct target-dir guarantees the
      # cache miss that makes it run.
      - name: jemalloc test suite
        if: matrix.jemalloc_tests == 1
        env:
          JEMALLOC_SYS_RUN_JEMALLOC_TESTS: 1
        run: cargo build -p jevmalloc-sys --target "$TARGET" --features stats,profiling,fill --target-dir target/jemalloc-check

  check:
    name: Rustfmt and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # rustfmt.toml sets unstable options, so formatting requires nightly.
      - run: rustup default nightly && rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      # The benches are stripped without --cfg bench; type-check them here.
      - run: cargo check -p jevmalloc --benches
        env:
          RUSTFLAGS: --cfg bench
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: --cfg jevmalloc_docs
