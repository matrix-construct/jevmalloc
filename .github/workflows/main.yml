name: CI

# The driver. It names the cells and nothing else: every cell is a bake target
# from docker/bake.hcl, run by .github/workflows/bake.yml, and reproducible
# locally with the same axes. See docker/README.md.

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      bake_target:
        description: 'standard runs the whole matrix, as a push does. Anything else runs that one target as a single cell, which is how the jemalloc knobs below are reached.'
        type: choice
        options: [standard, test, valgrind, build, suite, clippy, fmt, doc, bench]
        default: standard
      feat_set:
        description: 'Feature regime.'
        type: choice
        options: [all, default, stats, prefixed, none]
        default: all
      cargo_profile:
        description: 'dev configures jemalloc --enable-debug, release --disable-debug.'
        type: choice
        options: [dev, release]
        default: dev
      cc_name:
        type: choice
        options: [gcc, clang]
        default: gcc
      rust_toolchain:
        type: choice
        options: [stable, nightly]
        default: stable
      arch:
        type: choice
        options: [x64, arm64]
        default: x64
      malloc_conf:
        description: 'JEMALLOC_SYS_WITH_MALLOC_CONF. Empty for the default build.'
        type: string
      lg_page:
        description: 'JEMALLOC_SYS_WITH_LG_PAGE. Empty for the default build.'
        type: string
      lg_quantum:
        description: 'JEMALLOC_SYS_WITH_LG_QUANTUM. Below the platform default this is under-alignment UB, and tests/flags.rs is expected to catch it.'
        type: string

# The x64 pool is ten runner slots on a single machine that also carries
# Tuwunel's CI. The jobs below are therefore sequenced rather than fanned out at
# once, so our peak is one job's max-parallel and not their sum, and a
# superseded run is cancelled rather than left to queue behind. main is exempt:
# its history is what the support table is read against.
concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: ${{github.ref != 'refs/heads/main'}}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    if: github.event_name != 'workflow_dispatch' || inputs.bake_target == 'standard'
    uses: ./.github/workflows/bake.yml
    with:
      timeout: 30
      matrix: |
        [
          {"name": "Format", "bake_target": "fmt"},
          {"name": "Docs", "bake_target": "doc"},
          {"name": "Benches", "bake_target": "bench"},
          {"name": "Clippy",
           "bake_target": "clippy", "rust_toolchain": "stable", "feat_set": "all"},
          {"name": "Clippy (nightly)", "soft": true,
           "bake_target": "clippy", "rust_toolchain": "nightly", "feat_set": "all"}
        ]

  # Both symbol regimes have to run, not just build: jevmalloc-sys carries tests
  # that only compile under `prefixed` and others that only compile without it,
  # and jevmalloc/tests/ffi.rs is not compiled at all unless `stats` is on.
  test:
    name: Test
    needs: lint
    if: github.event_name != 'workflow_dispatch' || inputs.bake_target == 'standard'
    uses: ./.github/workflows/bake.yml
    with:
      timeout: 45
      max_parallel: 4
      matrix: |
        [
          {"name": "default", "bake_target": "test", "feat_set": "default"},
          {"name": "stats", "bake_target": "test", "feat_set": "stats"},
          {"name": "prefixed", "bake_target": "test", "feat_set": "prefixed"},
          {"name": "prefixed (release)",
           "bake_target": "test", "feat_set": "prefixed", "cargo_profile": "release"},
          {"name": "none", "bake_target": "test", "feat_set": "none"},
          {"name": "all", "bake_target": "test", "feat_set": "all"},
          {"name": "all (release)",
           "bake_target": "test", "feat_set": "all", "cargo_profile": "release"},
          {"name": "all (nightly)",
           "bake_target": "test", "feat_set": "all", "rust_toolchain": "nightly"},
          {"name": "all (clang)",
           "bake_target": "test", "feat_set": "all", "cc_name": "clang"},
          {"name": "musl",
           "bake_target": "test", "feat_set": "stats",
           "rust_target": "x86_64-unknown-linux-musl"}
        ]

  # Memcheck runs the same workspace unit, integration and doc tests as the
  # `none` test cell. Keeping this as one semantic regime avoids repeating
  # the compiler, profile and libc axes already covered above.
  valgrind:
    name: Valgrind
    needs: test
    if: github.event_name != 'workflow_dispatch' || inputs.bake_target == 'standard'
    uses: ./.github/workflows/bake.yml
    with:
      timeout: 45
      matrix: |
        [
          {"name": "none", "bake_target": "valgrind", "feat_set": "none"}
        ]

  # jemalloc's own ~1800-case suite, over the configure flags our features
  # actually move. `all` and `none` are the two extremes of the --enable/--disable
  # spread, and the cargo profile is the --enable-debug axis. `none` appears only
  # under release: its suite aborts at test/unit/double_free once --enable-debug
  # is added on top of everything-disabled. See docker/README.md.
  suite:
    name: jemalloc
    needs: valgrind
    if: github.event_name != 'workflow_dispatch' || inputs.bake_target == 'standard'
    uses: ./.github/workflows/bake.yml
    with:
      timeout: 60
      max_parallel: 3
      matrix: |
        [
          {"name": "all (debug)",
           "bake_target": "suite", "feat_set": "all", "cargo_profile": "dev"},
          {"name": "all (ndebug)",
           "bake_target": "suite", "feat_set": "all", "cargo_profile": "release"},
          {"name": "none (ndebug)",
           "bake_target": "suite", "feat_set": "none", "cargo_profile": "release"},
          {"name": "default (ndebug)",
           "bake_target": "suite", "feat_set": "default", "cargo_profile": "release"},
          {"name": "all (clang)",
           "bake_target": "suite", "feat_set": "all", "cc_name": "clang"}
        ]

  # The first two cells gate the support table's aarch64 build and run columns.
  # The third fills in its jemalloc column without gating, since an arm-only
  # failure in a ~1800-case C suite is one nothing here can reproduce.
  arm:
    name: aarch64
    needs: lint
    if: github.event_name != 'workflow_dispatch' || inputs.bake_target == 'standard'
    uses: ./.github/workflows/bake.yml
    with:
      arch: arm64
      timeout: 60
      max_parallel: 1
      matrix: |
        [
          {"name": "all", "bake_target": "test", "feat_set": "all"},
          {"name": "prefixed", "bake_target": "test", "feat_set": "prefixed"},
          {"name": "jemalloc", "soft": true,
           "bake_target": "suite", "feat_set": "all"}
        ]

  # The one leg outside bake: there is no macOS docker host, self-hosted or
  # otherwise. The build gates; the run reports without gating, since a macOS
  # failure is one nothing here can reproduce.
  darwin:
    name: Darwin (${{matrix.name}})
    if: github.event_name != 'workflow_dispatch' || inputs.bake_target == 'standard'
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: build
            cargo_cmd: build
          - name: test
            cargo_cmd: test
            soft: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      # Report-only through the step rather than the job, for the reason
      # bake.yml gives.
      - name: cargo ${{matrix.cargo_cmd}}
        id: cargo
        continue-on-error: ${{matrix.soft || false}}
        run: cargo ${{matrix.cargo_cmd}} --workspace --all-features

      - name: Report
        if: steps.cargo.outcome == 'failure'
        run: echo "::warning title=Darwin (${{matrix.name}})::report-only cell failed"

  dispatch:
    name: Dispatch
    if: github.event_name == 'workflow_dispatch' && inputs.bake_target != 'standard'
    uses: ./.github/workflows/bake.yml
    with:
      arch: ${{inputs.arch}}
      timeout: 90
      matrix: |
        [
          {"name": "${{inputs.bake_target}} ${{inputs.feat_set}} ${{inputs.cargo_profile}}",
           "bake_target": "${{inputs.bake_target}}",
           "feat_set": "${{inputs.feat_set}}",
           "cargo_profile": "${{inputs.cargo_profile}}",
           "cc_name": "${{inputs.cc_name}}",
           "rust_toolchain": "${{inputs.rust_toolchain}}",
           "malloc_conf": "${{inputs.malloc_conf}}",
           "lg_page": "${{inputs.lg_page}}",
           "lg_quantum": "${{inputs.lg_quantum}}"}
        ]
